  "**":
    - Check that the installed version is correct on the Plugins page.
    - Create and publish a course containing a module, lesson, and quiz with Learning Mode enabled.
    - Enrol as a student, complete the lesson and quiz, and finish the course.
    - Confirm the student's completion and quiz result appear correctly in Students and Grading.
    - Disable Learning Mode and confirm the course and lesson pages still display correctly.
