name: E2E
on:
    pull_request:
    workflow_call:
        secrets:
            SLACK_SENSEI_CHANNEL:
                required: false
            SLACK_WEBHOOK:
                required: false
env:
    CI: true

concurrency:
    group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        name: E2E Tests
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: '.nvmrc'

            - name: Get Node.js version
              id: node-version
              run: echo "version=$(node -v)" >> $GITHUB_OUTPUT

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.npm/
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: node-modules-cache
              with:
                  path: node_modules/
                  key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.version }}-node-modules-${{ hashFiles('package-lock.json') }}

            - name: Install PHP dependencies
              uses: ./.github/actions/install-php

            - name: Install JS dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci

            - name: Build assets
              run: npm run build:assets

            - name: Configure Ubuntu package mirrors
              run: |
                  # The Azure mirror can download too slowly to finish within the job timeout.
                  printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt

            - name: Install Playwright
              run: npx playwright install --with-deps chromium

            - name: Test environment tooling
              run: npm run test:env

            - name: Start wp-env
              run: npm run wp-env start

            - name: Run Playwright tests with @setup annotation
              run: CI=true npm run test:e2e:setup-only

            - name: Run Playwright tests
              run: CI=true npm run test:e2e

            - name: Archive report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
                  if-no-files-found: ignore
            - name: Slack Notification on Failure
              uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
              if: ${{ failure() && github.event_name == 'push' }}
              env:
                SLACK_CHANNEL: ${{ secrets.SLACK_SENSEI_CHANNEL }}
                SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                SLACK_TITLE: 'E2E Testing'
                SLACK_COLOR: 'error'
                SLACK_FOOTER: ''
