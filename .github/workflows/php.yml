name: PHP Linting and Tests

on:
    pull_request:
    workflow_call:

concurrency:
    group: php-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        name: PHP Linting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: Get cached composer directories
              uses: actions/cache@v6.1.0
              with:
                  path: ~/.cache/composer/
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
            - uses: actions/cache@v6.1.0
              with:
                  path: vendor/
                  key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '7.4'
                  tools: composer
                  coverage: none

            - name: Set up branches
              run: git checkout -b trunk refs/remotes/origin/trunk && git checkout -
              if: github.ref != 'refs/heads/trunk'

            - name: Install PHP dependencies
              run: composer self-update && composer install --no-ansi --no-interaction --prefer-dist --no-progress

            - name: Check for new issues
              run: ./scripts/linter-ci

            - name: Check for escaping
              run: ./vendor/bin/phpcs -s --sniffs=WordPress.WP.I18n,Generic.PHP.Syntax,WordPress.Security.EscapeOutput .

            - name: Check for nonces
              run: ./vendor/bin/phpcs -sn --sniffs=WordPress.Security.NonceVerification .

            - name: Check for input sanitization
              run: ./vendor/bin/phpcs -sn --sniffs=WordPress.Security.ValidatedSanitizedInput .

            - name: Check WPCOM rules
              run: ./vendor/bin/phpcs -sn --standard=./wpcom-phpcs.xml .
    test:
        name: "PHP Unit Tests (${{ matrix.php }}, ${{ matrix.wp }}${{ matrix.wpmu == 1 && ', multisite' || '' }}${{ matrix.hpps == 1 && ', HPPS' || '' }})"
        runs-on: ubuntu-latest
        continue-on-error: ${{ matrix.wp == 'nightly' }}
        strategy:
            fail-fast: true
            max-parallel: 10
            matrix:
                # "minimum" is resolved from the plugin's "Requires at least" header below.
                # On pull_request: popular versions plus the oldest and newest supported boundaries.
                # On workflow_call (trunk push): the full boundary matrix plus multisite and nightly.
                include: ${{ github.event_name == 'pull_request' && fromJSON('[{"php":"7.4","wp":"minimum"},{"php":"8.2","wp":"latest"},{"php":"8.3","wp":"latest"},{"php":"8.5","wp":"latest"},{"php":"8.3","wp":"latest","hpps":1}]') || fromJSON('[{"php":"7.4","wp":"minimum"},{"php":"7.4","wp":"latest"},{"php":"8.2","wp":"latest"},{"php":"8.3","wp":"latest"},{"php":"8.5","wp":"minimum"},{"php":"8.5","wp":"latest"},{"php":"8.3","wp":"latest","hpps":1},{"php":"8.3","wp":"latest","wpmu":1},{"php":"8.3","wp":"nightly"}]') }}
        env:
            WP_VERSION: ${{ matrix.wp }}
            WP_MULTISITE: ${{ matrix.wpmu }}
            PHP_VERSION: ${{ matrix.php }}
            ENABLE_HPPS: ${{ matrix.hpps }}
        services:
            database:
                image: mysql:5.6
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
        steps:
            - name: Install SVN
              run: |
                  sudo apt update
                  sudo apt install subversion
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Resolve minimum supported WordPress version
              if: matrix.wp == 'minimum'
              run: |
                  wp_version=$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Requires at least:[[:space:]]*([0-9]+\.[0-9]+).*/\1/p' sensei-lms.php)
                  if [[ -z "$wp_version" ]]; then
                      echo "::error::Could not read the minimum WordPress version from sensei-lms.php"
                      exit 1
                  fi
                  echo "WP_VERSION=$wp_version" >> "$GITHUB_ENV"
                  echo "Using minimum supported WordPress version: $wp_version"

            - name: Get cached composer directories
              uses: actions/cache@v6.1.0
              with:
                  path: ~/.cache/composer/
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
            - uses: actions/cache@v6.1.0
              with:
                  path: vendor/
                  key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mysql
                  tools: composer
                  coverage: none

            - name: Tool versions
              run: |
                  php --version
                  composer --version

            - name: Install PHP dependencies
              run: composer install --no-ansi --no-interaction --prefer-dist --no-progress --ignore-platform-reqs

            - name: Setup test environment
              run: bash ./tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 $WP_VERSION

            - name: Run tests
              run: ./vendor/bin/phpunit

            - name: Slack Notification on Failure
              uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
              if: ${{ failure() && github.event_name == 'push' }}
              env:
                SLACK_CHANNEL: ${{ secrets.SLACK_SENSEI_CHANNEL }}
                SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                SLACK_TITLE: 'PHP Testing'
                SLACK_COLOR: 'error'
                SLACK_FOOTER: ''
