name: Claude Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot' &&
        (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot' &&
        (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body || '', '@claude') && github.event.review.user.type != 'Bot' &&
        (github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'OWNER'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Load Claude system prompt
        run: echo "APPEND_SYSTEM_PROMPT<<PROMPT_EOF" >> "$GITHUB_ENV" && cat .github/claude/review-prompt.md >> "$GITHUB_ENV" && echo "PROMPT_EOF" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7  # v1.0.206
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_fix_links: false
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 50
            --max-budget-usd 5.00
            --permission-mode plan
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Edit" "Write" "NotebookEdit" "Bash(git add *)" "Bash(git commit *)" "Bash(git push *)" "Bash(git checkout *)" "Bash(git switch *)" "Bash(git branch *)" "Bash(gh api *)" "Bash(gh pr edit *)" "Bash(gh pr merge *)" "Bash(gh pr close *)"
