name: JS Linting and Tests

on:
    pull_request:
    workflow_call:
        secrets:
            SLACK_SENSEI_CHANNEL:
                required: false
            SLACK_WEBHOOK:
                required: false

concurrency:
    group: js-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    lint:
        name: JS Linting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: '.nvmrc'
            - name: Get Node.js version
              id: node-version
              run: echo "version=$(node -v)" >> $GITHUB_OUTPUT
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.npm/
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: node-modules-cache
              with:
                  path: node_modules/
                  key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.version }}-node-modules-${{ hashFiles('package-lock.json') }}
            - name: Install JS dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci
            - name: Lint JS
              run: npm run lint-js
            - name: Lint TS e2e
              run: npm run lint-e2e

    type-check:
        name: TypeScript Checking
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: '.nvmrc'
            - name: Get Node.js version
              id: node-version
              run: echo "version=$(node -v)" >> $GITHUB_OUTPUT
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.npm/
                  key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: node-modules-cache
              with:
                  path: node_modules/
                  key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.version }}-node-modules-${{ hashFiles('package-lock.json') }}
            - name: Install JS dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci
            - name: Lint JS
              run: npm run lint-types

    test:
        name: JS Testing
        runs-on: ubuntu-latest
        steps:
            # clone the repository
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: '.nvmrc'
            - name: Get Node.js version
              id: node-version
              run: echo "version=$(node -v)" >> $GITHUB_OUTPUT
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: node-modules-cache
              with:
                  path: node_modules/
                  key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.version }}-node-modules-${{ hashFiles('package-lock.json') }}
            - name: Install JS dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci
            - name: Test JS
              env:
                  NODE_OPTIONS: "--max_old_space_size=4096"
              run: npm run test-js
            - name: Slack Notification on Failure
              uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
              if: ${{ failure() && github.event_name == 'push' }}
              env:
                SLACK_CHANNEL: ${{ secrets.SLACK_SENSEI_CHANNEL }}
                SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                SLACK_TITLE: 'JS Testing'
                SLACK_COLOR: 'error'
                SLACK_FOOTER: ''
