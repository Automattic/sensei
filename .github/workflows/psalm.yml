name: Psalm Test

on:
    pull_request:
    workflow_call:

concurrency:
    group: psalm-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    tests:
        name: Psalm
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            max-parallel: 10
            matrix:
                # On pull_request: only the current target version. On workflow_call (trunk push): both versions.
                php: ${{ github.event_name == 'pull_request' && fromJSON('["8.2"]') || fromJSON('["7.4", "8.2"]') }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3
              with:
                  fetch-depth: 0

            - name: Get cached composer directories
              uses: actions/cache@v5
              with:
                  path: ~/.cache/composer/
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
            - uses: actions/cache@v5
              with:
                  path: vendor/
                  key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer
                  coverage: none

            - name: Install
              run: composer install --no-ansi --no-interaction --prefer-dist --no-progress

            - name: Run Psalm
              run: ./vendor/bin/psalm