name: Repo gardening

on:
  issues:
    types: [opened, reopened, edited, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  repo-gardening:
    permissions:
      contents: read
      actions: read
      issues: write
    name: 'Perform automated triage tasks on issues'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
     - name: Checkout
       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       with:
         persist-credentials: false

     - name: Setup Node
       uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
       with:
         node-version-file: '.nvmrc'

     - name: Wait for prior instances of the workflow to finish
       uses: softprops/turnstyle@3805450be63b8c80577dc253e8c17e9132036df4 # v3.3.3
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

     - name: 'Run gardening action'
       uses: automattic/action-repo-gardening@d6dc933a291b22f223abcfb5a6c85613dfa7f48b # trunk
       with:
         github_token: ${{ secrets.GITHUB_TOKEN }}
         slack_token: ${{ secrets.SLACK_TOKEN }}
         slack_he_triage_channel: ${{ secrets.SLACK_HE_TRIAGE_CHANNEL }}
         slack_quality_channel: ${{ secrets.SLACK_QUALITY_CHANNEL }}
         tasks: 'gatherSupportReferences,replyToCustomersReminder'
